name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  linux:
    # An older Ubuntu keeps the AppImage and .deb compatible with more Linux versions.
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match app version $version." >&2
            exit 1
          fi

      - name: Install Linux libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - run: npm run tauri build

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Focus Buddy $GITHUB_REF_NAME" \
            --generate-notes \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/rpm/*.rpm
